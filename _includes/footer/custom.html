<!-- Make figures in pages and posts tappable: opens the full-size image in a new tab -->
<script>
  document.querySelectorAll('.page__content img').forEach(function (img) {
    if (img.closest('a')) return;
    var a = document.createElement('a');
    a.href = img.getAttribute('src');
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = 'Open full size';
    img.parentNode.insertBefore(a, img);
    a.appendChild(img);
  });
</script>
